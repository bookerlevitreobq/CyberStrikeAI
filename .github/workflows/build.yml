name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go mod download
      - run: go build -v -o cyberstrike-ai ./cmd/server/
      - uses: actions/upload-artifact@v4
        with:
          name: cyberstrike-ai-linux-amd64
          path: cyberstrike-ai
